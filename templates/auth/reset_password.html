{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="glass card-pad animate-in" style="max-width:420px;margin:2.5rem auto;">
  <h2>Set a new password</h2>
  <form method="POST" novalidate>
    {{ form.hidden_tag() }}
    <div class="form-group">{{ form.password.label }} {{ form.password() }}</div>
    <div class="form-group">{{ form.confirm_password.label }} {{ form.confirm_password() }}</div>
    <button class="btn btn-primary" style="width:100%;" type="submit">Reset Password</button>
  </form>
</div>
{% endblock %}
