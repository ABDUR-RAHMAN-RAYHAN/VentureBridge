{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="glass card-pad animate-in" style="max-width:520px;margin:0 auto;">
  <h1>Contact Us</h1>
  <form method="POST" novalidate>
    {{ form.hidden_tag() }}
    <div class="form-group">{{ form.name.label }} {{ form.name() }}</div>
    <div class="form-group">{{ form.email.label }} {{ form.email() }}</div>
    <div class="form-group">{{ form.message.label }} {{ form.message(rows=5) }}</div>
    <button class="btn btn-primary" type="submit">Send Message</button>
  </form>
</div>
{% endblock %}
